<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subnet Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Subnet Calculator</h1>
    <p>Enter an IP address and the number after the slash to see the network details.</p>

    <label for="ip">IP address</label>
    <input type="text" id="ip" placeholder="192.168.1.0">

    <label for="prefix">Prefix (the number after the slash)</label>
    <input type="number" id="prefix" min="0" max="32" placeholder="24">

    <button id="calculate">Calculate</button>

    <p id="error"></p>
    <div id="results"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
